<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | nico.ioshop</title><link rel="stylesheet" href="/style.css"><style>.adminPage{max-width:1100px;margin:auto;padding:50px 5%}.panel{background:#111419;border:1px solid #292e35;border-radius:20px;padding:25px;margin:20px 0}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form input,.form select{background:#08090b;border:1px solid #303640;color:#fff;padding:12px;border-radius:10px}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #292e35;font-size:13px}.danger{background:#3a171b;color:#ff9da6;border:0;padding:8px;border-radius:8px}@media(max-width:700px){.form{grid-template-columns:1fr}.table{font-size:11px;display:block;overflow:auto}}</style></head><body><header><div class="brand">nico<span>.</span>ioshop <small style="color:#888">ADMIN</small></div><a href="/">← Ver tienda</a></header><main class="adminPage"><div id="login" class="panel"><h2>Panel de administración</h2><p class="meta">Desde acá podés cargar y actualizar productos.</p><div class="form"><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button class="btn" onclick="login()">Ingresar</button></div></div><div id="app" style="display:none"><div class="panel"><h2>Agregar producto</h2><div class="form"><input id="name" placeholder="Nombre"><input id="category" placeholder="Categoría"><input id="condition" placeholder="Nuevo / Seminuevo"><input id="storage" placeholder="GB"><input id="color" placeholder="Color"><input id="battery" placeholder="Batería"><input id="price_usd" type="number" placeholder="Precio USD"><input id="stock" type="number" placeholder="Stock"><input id="image" class="full" placeholder="URL de imagen"><input id="badge" placeholder="Badge"><input id="description" class="full" placeholder="Descripción"><button class="btn" onclick="add()">Guardar producto</button></div></div><div class="panel"><div style="display:flex;justify-content:space-between"><h2>Productos</h2><button class="danger" onclick="logout()">Salir</button></div><div id="list"></div></div></div></main><script>
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:user.value,password:pass.value})});if(r.ok){loginBox();load()}else alert("Datos incorrectos")}
function loginBox(){document.querySelector("#login").style.display="none";document.querySelector("#app").style.display="block"}
async function load(){let r=await fetch("/api/admin/products");if(!r.ok)return;let ps=await r.json();list.innerHTML=`<table class="table"><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr>`+ps.map(p=>`<tr><td>${p.name}<br><span class="meta">${p.storage} ${p.color} ${p.battery}</span></td><td>${p.category}</td><td>${p.price_usd??"Consultar"}</td><td>${p.stock}</td><td><button class="danger" onclick="del(${p.id})">Ocultar</button></td></tr>`).join("")+"</table>"}
async function add(){let x={};["name","category","condition","storage","color","battery","price_usd","stock","image","badge","description"].forEach(k=>x[k]=document.getElementById(k).value);x.price_usd=x.price_usd?Number(x.price_usd):null;x.stock=Number(x.stock||0);let r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)});if(r.ok){alert("Producto guardado");load()}else alert("Error")}
async function del(id){if(!confirm("¿Ocultar producto?"))return;await fetch("/api/admin/products/"+id,{method:"DELETE"});load()}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
</script></body></html>
