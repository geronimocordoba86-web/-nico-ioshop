services:
  - type: web
    name: nico-ioshop
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: nico-ioshop-data
      mountPath: /app
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: CURRENCY_RATE
        value: "1550"
